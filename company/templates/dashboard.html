<title>Trụ Sở Phần Mềm</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
  /* Layout: a floating Mars-orange island in deep space (single dark world, both themes).
     HUD + phase rail on top; map (left) with a click-to-inspect panel (right); task board + live log below. */
  :root{
    --space-0:#060a15; --space-1:#0c1427;
    --panel:#111a31; --panel-2:#0d1630; --line:#243262;
    --ink:#f5efe1; --muted:#9ea8c8; --dim:#6c779b;
    --accent:#ffb84d; --accent-2:#ff8f3c;
    --online:#49d79b; --standby:#5e6b90; --gate:#f2b53c; --crit:#ff5d6c; --info:#6aa8ff;
    --paper:#fffaf0; --paper-ink:#1c2236; --paper-sub:#6b7184;
    --win-off:#3a4468; --win-on:#ffd98a;
    --f-display:"Baloo 2",ui-rounded,system-ui,sans-serif;
    --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--ink);font-family:var(--f-body);min-height:100%;
    background:
      radial-gradient(1200px 700px at 72% -5%, #16224a 0%, transparent 55%),
      radial-gradient(900px 600px at 10% 110%, #1a1230 0%, transparent 55%),
      linear-gradient(180deg,var(--space-1),var(--space-0));
    background-color:var(--space-0);}
  .stars{position:fixed;inset:0;z-index:0;pointer-events:none}
  .wrap{position:relative;z-index:1;max-width:1840px;margin:0 auto;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-block:18px 32px;display:flex;flex-direction:column;gap:14px}
  h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
  code,.mono{font-family:var(--f-mono);font-size:.78em}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---- HUD ---- */
  .hud{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .logo{width:44px;height:44px;flex:0 0 auto;border-radius:13px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 6px 18px rgba(255,140,60,.35)}
  .logo svg{width:26px;height:26px}
  .brand h1{font-size:1.6rem;font-weight:800;line-height:1}
  .brand p{margin:4px 0 0;color:var(--muted);font-size:.82rem}
  .mode{display:inline-flex;align-items:center;gap:6px;font-size:.66rem;font-weight:700;letter-spacing:.1em;
    text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);
    vertical-align:2px;margin-left:6px;color:var(--muted)}
  .mode .d{width:7px;height:7px;border-radius:50%;background:var(--standby)}
  .mode.live{color:var(--online);border-color:#245244}.mode.live .d{background:var(--online);animation:pulse 1.6s infinite}
  .mode.demo{color:var(--accent);border-color:#5a4520}.mode.demo .d{background:var(--accent);animation:pulse 1s infinite}
  .mode.off{color:var(--crit);border-color:#5a2630}.mode.off .d{background:var(--crit)}
  .stats{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px;min-width:96px}
  .stat b{display:block;font-family:var(--f-display);font-size:1.4rem;line-height:1;font-variant-numeric:tabular-nums}
  .stat span{font-size:.64rem;text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}
  .stat.good b{color:var(--online)}.stat.accent b{color:var(--accent)}
  .stat.u-ok b{color:var(--online)}.stat.u-soft b{color:var(--gate)}.stat.u-hard b{color:var(--crit)}
  .stat.u-soft{border-color:#5a4520}.stat.u-hard{border-color:#5a2630}

  /* ---- phase rail ---- */
  .pipe{display:flex;gap:6px;overflow-x:auto;padding:8px 2px 6px;scrollbar-width:thin}
  .phase{flex:0 0 auto;display:flex;flex-direction:column;gap:4px;align-items:center;min-width:74px;
    padding:8px 10px;border-radius:11px;background:var(--panel-2);border:1px solid var(--line);position:relative}
  .phase .n{font-size:.62rem;color:var(--dim);letter-spacing:.09em}
  .phase .t{font-size:.76rem;font-weight:600;color:var(--muted);text-align:center;line-height:1.15}
  .phase.done{border-color:#2c4a3f}.phase.done .t{color:var(--online)}
  .phase.cur{background:linear-gradient(180deg,rgba(255,184,77,.2),rgba(255,184,77,.04));border-color:var(--accent)}
  .phase.cur .t,.phase.cur .n{color:var(--accent)}
  .phase .gate{position:absolute;top:-7px;right:-6px;font-size:.58rem;font-weight:800;font-family:var(--f-display);
    background:var(--gate);color:#241a05;border-radius:7px;padding:1px 5px}
  .phase .gate.ok{background:var(--online);color:#06261a}

  /* ---- map + panel ---- */
  .main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
  .mapcard{background:linear-gradient(180deg,rgba(18,28,56,.55),rgba(8,12,24,.55));border:1px solid var(--line);
    border-radius:18px;overflow:hidden;position:relative;min-width:0}
  .mapscroll{overflow-x:auto;scrollbar-width:thin}
  /* fill the column, but never taller than the window so the whole island stays in view */
  svg.map{display:block;width:100%;min-width:660px;height:auto;max-height:calc(100vh - 96px);user-select:none}
  svg.map.zoomed{cursor:grab;touch-action:none}
  svg.map.panning{cursor:grabbing}
  svg.map .ntag{display:none}
  svg.map.close .ntag{display:inline}
  .zoom{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
  .zoom button{border:0;background:none;padding:5px 12px;cursor:pointer;font-weight:700;font-size:.95rem;line-height:1}
  .zoom button:hover{color:var(--accent)}
  .zoom button[disabled]{opacity:.35;cursor:default;color:inherit}
  .zoom output{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);min-width:40px;text-align:center;font-variant-numeric:tabular-nums}
  /* full-window map: map + panel take the whole viewport */
  body.maxmap{overflow:hidden}
  .main.max{position:fixed;inset:0;z-index:30;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));
    align-items:stretch;background:linear-gradient(180deg,var(--space-1),var(--space-0))}
  .main.max .mapcard{display:flex;flex-direction:column;min-height:0}
  .main.max .mapscroll{flex:1 1 auto;min-height:0;overflow:hidden}
  .main.max svg.map{height:100%;max-height:none;min-width:0;touch-action:none}
  .main.max .panel{max-height:100%}
  .maptools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px 12px;border-top:1px solid var(--line)}
  .maptools .hint{font-size:.74rem;color:var(--dim);margin-right:auto}
  .btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);
    border-radius:999px;padding:6px 13px;font-size:.78rem;font-weight:600;cursor:pointer}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn[disabled]{opacity:.45;cursor:default;color:inherit;border-color:var(--line)}
  .btn svg{width:12px;height:12px}

  svg.map .bld,svg.map .plaque,svg.map .critter{cursor:pointer}
  svg.map .bld:hover>*{filter:brightness(1.08)}
  svg.map .win{fill:var(--win-off);transition:fill .6s}
  svg.map .duty .win{fill:#c9a86a}
  svg.map .work .win{fill:var(--win-on)}
  svg.map .beacon{fill:var(--standby)}
  svg.map .work .beacon{fill:var(--online);animation:pulse 1.4s ease-in-out infinite}
  svg.map .fx{opacity:0;transition:opacity .5s}
  svg.map .work .fx{opacity:1}
  svg.map .flame{animation:flick .18s steps(2) infinite alternate;transform-box:fill-box;transform-origin:50% 0}
  svg.map .ring{animation:ring 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
  svg.map .ring.r2{animation-delay:1.2s}
  svg.map .holo{animation:dash 6s linear infinite}
  svg.map .typing circle{animation:blink 1.2s infinite}
  svg.map .typing circle:nth-child(3){animation-delay:.2s}svg.map .typing circle:nth-child(4){animation-delay:.4s}
  svg.map .plaque.sel rect.card{stroke:var(--accent);stroke-width:2.2}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @keyframes flick{from{transform:scaleY(.8)}to{transform:scaleY(1.15)}}
  @keyframes ring{from{transform:scale(.3);opacity:.9}to{transform:scale(1.6);opacity:0}}
  @keyframes dash{to{stroke-dashoffset:-120}}
  @keyframes blink{0%,100%{opacity:.25}40%{opacity:1}}

  /* ---- panel ---- */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;position:sticky;top:12px;min-width:0;
    max-height:calc(100vh - 24px);overflow:auto;scrollbar-width:thin}
  .eyebrow{font-size:.64rem;text-transform:uppercase;letter-spacing:.12em;color:var(--dim)}
  .panel h2{font-size:1.25rem;margin:2px 0}
  .panel .sub{color:var(--muted);font-size:.83rem;margin:0 0 12px;line-height:1.45}
  .lead{display:flex;gap:12px;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin-bottom:12px}
  .lead svg{width:46px;height:56px;flex:0 0 auto}
  .lead b{font-family:var(--f-display);font-size:1rem;display:block}
  .lead span{font-size:.76rem;color:var(--muted)}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;padding:4px 10px;
    border-radius:999px;border:1px solid var(--line);background:var(--panel-2)}
  .chip .d{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
  .agents{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  .agents li{background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:9px 11px;min-width:0}
  .agents li.run{border-color:#2c6150;box-shadow:inset 3px 0 0 var(--online)}
  .agents .nm{font-family:var(--f-mono);font-size:.76rem;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .agents .ro{color:var(--muted);font-size:.76rem;margin-top:3px;line-height:1.35;overflow-wrap:anywhere}
  .agents .now{color:var(--online);font-size:.76rem;margin-top:4px;line-height:1.35;overflow-wrap:anywhere}
  .tag{font-family:var(--f-body);font-size:.6rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    padding:1px 6px;border-radius:6px;background:#1d2a50;color:var(--muted)}
  .tag.on{background:#173d31;color:var(--online)}
  .legend{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .legend .row{display:flex;gap:9px;font-size:.78rem;color:var(--muted);align-items:flex-start;line-height:1.35}
  .legend .d{width:10px;height:10px;border-radius:50%;margin-top:3px;flex:0 0 auto}
  .foot{color:var(--dim);font-size:.72rem;margin-top:14px;line-height:1.45}
  .foot code{color:var(--muted)}

  /* ---- boards ---- */
  .boards{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
  .board{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px;min-width:0}
  .board h3{font-size:1.05rem;display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .board h3 small{font-family:var(--f-body);font-size:.72rem;color:var(--dim);font-weight:500}
  .tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
  .tasks li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;
    background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
  .tasks .num{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);
    font-weight:700;font-size:.8rem;color:#06261a;background:var(--online)}
  .tasks .num.run{background:var(--accent);color:#2a1a02}.tasks .num.wait{background:var(--standby);color:var(--ink)}
  .tasks .t{font-weight:600;font-size:.84rem;overflow-wrap:anywhere}
  .tasks .w{font-size:.72rem;color:var(--muted);margin-top:1px;overflow-wrap:anywhere}
  .st{font-size:.7rem;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .st.done{background:#173d31;color:var(--online)}.st.run{background:#3f2e10;color:var(--accent)}.st.wait{background:#1d2a50;color:var(--muted)}
  .feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:330px;overflow:auto;scrollbar-width:thin}
  .feed li{display:grid;grid-template-columns:58px 10px minmax(0,1fr);gap:8px;align-items:baseline;font-size:.79rem;color:var(--muted);line-height:1.4}
  .feed time{font-family:var(--f-mono);font-size:.7rem;color:var(--dim);font-variant-numeric:tabular-nums}
  .feed .d{width:8px;height:8px;border-radius:50%;align-self:center}
  .feed b{color:var(--ink);font-weight:600}
  .empty{color:var(--dim);font-size:.8rem;line-height:1.5;padding:10px 2px}

  @media (max-width:900px){
    .main,.boards{grid-template-columns:minmax(0,1fr)}
    .panel{position:static;max-height:none}
    .stats{margin-left:0;width:100%}.stat{flex:1 1 auto}
    .main.max{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
    .main.max .panel{max-height:36vh}
  }
  @media (prefers-reduced-motion:reduce){
    svg.map *{animation:none!important}
  }
</style>

</div>

const RES=.2, N=Math.ceil(GS/RES), blocked=new Uint8Array(N*N);
function buildGrid(){
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){const x=(i+.5)*RES,y=(j+.5)*RES;let b=x<.35||y<.35||x>GS-.35||y>GS-.35;
    if(!b)for(const d of DEPTS){if(x>d.gx-.14&&x<d.gx+d.w+.14&&y>d.gy-.14&&y<d.gy+d.d+.14){b=true;break}}
    blocked[i*N+j]=b?1:0;}
}
const isFree=(x,y)=>{const i=Math.floor(x/RES),j=Math.floor(y/RES);return i>=0&&j>=0&&i<N&&j<N&&!blocked[i*N+j];};
function nearestFree(p){if(isFree(p.x,p.y))return p;
  for(let r=.1;r<2;r+=.1)for(let a=0;a<16;a++){const q={x:p.x+Math.cos(a/16*6.283)*r,y:p.y+Math.sin(a/16*6.283)*r};if(isFree(q.x,q.y))return q;}return p;}
function lineFree(a,b){const n=Math.ceil(Math.hypot(b.x-a.x,b.y-a.y)/.07);for(let k=0;k<=n;k++){const t=k/n;if(!isFree(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t))return false;}return true;}
const pathCache=new Map();
function findPath(a,b){
  a=nearestFree(a);b=nearestFree(b);const key=[a.x,a.y,b.x,b.y].map(v=>v.toFixed(2)).join();
  if(pathCache.has(key))return pathCache.get(key);
  if(lineFree(a,b)){pathCache.set(key,[a,b]);return [a,b];}
  const idx=(i,j)=>i*N+j,si=Math.floor(a.x/RES),sj=Math.floor(a.y/RES),ti=Math.floor(b.x/RES),tj=Math.floor(b.y/RES);
  const g=new Float32Array(N*N).fill(1e9),from=new Int32Array(N*N).fill(-1),closed=new Uint8Array(N*N),heap=[];
  const h=(i,j)=>{const dx=Math.abs(i-ti),dy=Math.abs(j-tj);return dx+dy+(Math.SQRT2-2)*Math.min(dx,dy);};
  const push=(f,n)=>{heap.push([f,n]);let k=heap.length-1;while(k>0){const p=(k-1)>>1;if(heap[p][0]<=heap[k][0])break;[heap[p],heap[k]]=[heap[k],heap[p]];k=p;}};
  const pop=()=>{const top=heap[0],last=heap.pop();if(heap.length){heap[0]=last;let k=0;for(;;){const l=2*k+1,r=l+1;let m=k;if(l<heap.length&&heap[l][0]<heap[m][0])m=l;if(r<heap.length&&heap[r][0]<heap[m][0])m=r;if(m===k)break;[heap[m],heap[k]]=[heap[k],heap[m]];k=m;}}return top;};
  g[idx(si,sj)]=0;push(h(si,sj),idx(si,sj));let found=false;
  while(heap.length){const [,n]=pop();if(closed[n])continue;closed[n]=1;const i=Math.floor(n/N),j=n%N;if(i===ti&&j===tj){found=true;break;}
    for(let di=-1;di<=1;di++)for(let dj=-1;dj<=1;dj++){if(!di&&!dj)continue;const ni=i+di,nj=j+dj;if(ni<0||nj<0||ni>=N||nj>=N)continue;const m=idx(ni,nj);
      if(blocked[m]||closed[m])continue;if(di&&dj&&(blocked[idx(i+di,j)]||blocked[idx(i,j+dj)]))continue;
      const ng=g[n]+(di&&dj?Math.SQRT2:1);if(ng<g[m]){g[m]=ng;from[m]=n;push(ng+h(ni,nj),m);}}}

  while(cur<raw.length-1){let nxt=raw.length-1;while(nxt>cur+1&&!lineFree(raw[cur],raw[nxt]))nxt--;out.push(raw[nxt]);cur=nxt;}
  pathCache.set(key,out);return out;
}

  DEPTS.forEach(d=>{const t=P(d.gx+d.w/2,d.gy+d.d/2,d.top),sub=`${d.name} · ${d.agents.length} agent`;
    const mine=run.filter(a=>a.dept===d.id),pills=mine.slice(0,2).map(a=>clip(a.desc||`${VERB[a.tool]||"Làm"} ${base(a.target)}`,30));
    if(mine.length>2)pills.push(`+${mine.length-2} agent nữa`);
    const w=Math.max(d.place.length*6.9,sub.length*4.9)+22,ph=pills.length*20;
    blocks.push({d,t,sub,pills,w,h:31+ph,x:t.x-w/2,y:t.y-46-ph});});
  /* greedy de-overlap: front labels keep their spot, labels behind them move up */
  const placed=[];
  blocks.sort((a,b)=>b.t.y-a.t.y).forEach(b=>{
    for(let k=0;k<12;k++){const hit=placed.find(o=>b.x<o.x+o.w+6&&b.x+b.w+6>o.x&&b.y<o.y+o.h+4&&b.y+b.h+4>o.y);if(!hit)break;b.y=hit.y-b.h-6;}
    placed.push(b);});
  let s="";
  blocks.sort((a,b)=>a.t.y-b.t.y).forEach(({d,t,sub,pills,w,h,x,y})=>{
    const cy=y+h-31;d.labelY=cy;
    if(cy+36<t.y-14)s+=`<line x1="${t.x}" y1="${cy+34}" x2="${t.x}" y2="${t.y-6}" stroke="var(--paper)" stroke-width="1.4" stroke-dasharray="2 3" opacity=".7"/>`;
    s+=`<g class="plaque${selected===d.id?" sel":""}" data-id="${d.id}" tabindex="0" role="button" aria-label="${esc(d.place+" – "+d.name)}">
      <path d="M${t.x-5},${cy+30} l5,6 l5,-6z" fill="var(--paper)"/>
      <rect class="card" x="${x}" y="${cy}" width="${w}" height="31" rx="8" fill="var(--paper)" stroke="${shade(d.color,-.25)}" stroke-width="1.2"/>
      <rect x="${x}" y="${cy}" width="5" height="31" rx="2.5" fill="${d.color}"/>
      <text x="${x+12}" y="${cy+14}" font-family="Baloo 2" font-size="12.5" font-weight="700" fill="var(--paper-ink)">${esc(d.place)}</text>
      <text x="${x+12}" y="${cy+25.5}" font-family="Be Vietnam Pro" font-size="8.4" fill="var(--paper-sub)">${esc(sub)}</text></g>`;
    pills.forEach((txt,i)=>{const more=txt.startsWith("+"),pw=txt.length*4.75+(more?14:28),py=cy-20-i*20;
      s+=more?`<text x="${t.x}" y="${py+12}" text-anchor="middle" font-family="Be Vietnam Pro" font-size="9" fill="#9ea8c8">${esc(txt)}</text>`
        :`<g class="pill"><rect x="${t.x-pw/2}" y="${py}" width="${pw}" height="17" rx="8.5" fill="#0d1530" stroke="#3a4a7e"/>
        <circle cx="${t.x-pw/2+10}" cy="${py+8.5}" r="4" fill="var(--accent)"><animate attributeName="opacity" values="1;.3;1" dur="1.4s" repeatCount="indefinite"/></circle>
        <text x="${t.x-pw/2+19}" y="${py+12}" font-family="Be Vietnam Pro" font-size="8.6" font-weight="600" fill="#f5efe1">${esc(txt)}</text></g>`;});});
  L.labels.innerHTML=s;
  L.labels.querySelectorAll(".plaque").forEach(el=>{el.addEventListener("click",()=>select(el.dataset.id));el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();select(el.dataset.id);}});});
}

/* ================= leaders that walk ================= */
const SPEED=REDUCED?99:1.8;            // grid units per second
const MS=1.5;                          // mascot scale
class Critter{
  constructor(d){this.d=d;this.pos={...d.home};this.face=d.tan.x?1:-1;this.path=[];this.queue=[];this.step=null;this.t=Math.random()*9;this.wait=0;this.walking=false;
    const g=document.createElementNS(SVGNS,"g"),tw=d.leader.name.length*4.6+12;g.setAttribute("class","critter");
    g.innerHTML=`<title>${esc(d.leader.name)} – trưởng phòng ${esc(d.name)}</title><g class="body">${mascot(d.leader.sp,d.color)}</g>`+
      `<g class="ntag"><rect x="${-tw/2}" y="5" width="${tw}" height="12" rx="6" fill="#0d1530" stroke="${d.color}" stroke-width=".8"/>`+
      `<text x="0" y="13.6" text-anchor="middle" font-family="Be Vietnam Pro" font-size="7.6" font-weight="600" fill="#f5efe1">${esc(d.leader.name)}</text></g>`;
    g.addEventListener("click",()=>select(d.id));this.el=g;this.body=g.querySelector(".body");this.legs=[g.querySelector(".legL"),g.querySelector(".legR")];
    L.scene.appendChild(g);
    const b=document.createElementNS(SVGNS,"g");b.setAttribute("class","bub");b.style.display="none";L.bubbles.appendChild(b);this.bub=b;
    const ty=document.createElementNS(SVGNS,"g");ty.setAttribute("class","typing");ty.style.display="none";
    ty.innerHTML=`<rect x="-13" y="-9" width="26" height="14" rx="7" fill="#fffaf0"/><circle cx="-6" cy="-2" r="2" fill="#1c2236"/><circle cx="0" cy="-2" r="2" fill="#1c2236"/><circle cx="6" cy="-2" r="2" fill="#1c2236"/>`;
    L.bubbles.appendChild(ty);this.typing=ty;this.sayUntil=0;}
  get depth(){return this.pos.x+this.pos.y+.05;}
  visit(target,say,reply,hold=2600){this.queue.push({target,say,reply,hold});}
  say(text,ms=2400){this.sayText=text;this.sayUntil=performance.now()+ms;this.drawBubble();}
  drawBubble(){const lines=wrap(this.sayText,30),w=Math.max(...lines.map(l=>l.length))*5.8+20,h=lines.length*13+10;
    this.bub.innerHTML=`<rect x="${-w/2}" y="${-h}" width="${w}" height="${h}" rx="8" fill="#fffaf0" stroke="#1c2236" stroke-opacity=".25"/><path d="M-5,-1 l5,7 l5,-7z" fill="#fffaf0"/>`+
      lines.map((l,i)=>`<text x="0" y="${-h+16.5+i*13}" text-anchor="middle" font-family="Be Vietnam Pro" font-size="10.2" font-weight="600" fill="#1c2236">${esc(l)}</text>`).join("");
    this.bub.style.display="";}
  reset(){this.queue=[];this.step=null;this.path=[];this.pos={...this.d.home};this.sayUntil=0;this.bub.style.display="none";}
  update(dt,now){
    this.t+=dt;
    if(!this.path.length&&this.wait<=0){
      if(this.step&&this.step.phase==="go"){this.step.phase="talk";this.wait=this.step.hold/1000;
        if(this.step.say)this.say(this.step.say,this.step.hold);
        const host=this.step.target.critter,reply=this.step.reply;if(reply&&host&&host!==this&&!host.path.length){host.face=this.pos.x-host.pos.x-(this.pos.y-host.pos.y)>0?1:-1;setTimeout(()=>host.say(reply,1900),650);}}
      else if(this.queue.length){this.step={...this.queue.shift(),phase:"go"};const k=this.step.target===this.d?0:(this.d.id==="lead"?1:-1);
        this.path=findPath(this.pos,visitSpot(this.step.target,k)).slice(1);}
      else if(this.step){this.step=null;this.path=findPath(this.pos,this.d.home).slice(1);}
    }
    if(this.wait>0)this.wait-=dt;
    this.walking=false;
    if(this.path.length){const tgt=this.path[0],dx=tgt.x-this.pos.x,dy=tgt.y-this.pos.y,dist=Math.hypot(dx,dy),stp=SPEED*dt;
      if(dist<=stp){this.pos={...tgt};this.path.shift();}else{this.pos.x+=dx/dist*stp;this.pos.y+=dy/dist*stp;}
      const sx=(dx-dy);if(Math.abs(sx)>.001)this.face=sx>0?1:-1;this.walking=true;}
    const p=P(this.pos.x,this.pos.y),bob=this.walking?-Math.abs(Math.sin(this.t*11))*2.2:Math.sin(this.t*2.2)*.6;
    this.el.setAttribute("transform",`translate(${p.x.toFixed(1)},${(p.y+bob).toFixed(1)})`);
    this.body.setAttribute("transform",`scale(${this.face*MS},${MS})`);
    if(this.legs[0]){const sw=this.walking?Math.sin(this.t*11)*1.8:0;this.legs[0].setAttribute("transform",`translate(0,${-Math.max(0,sw)})`);this.legs[1].setAttribute("transform",`translate(0,${-Math.max(0,-sw)})`);}
    const top=p.y-(this.d.leader.sp==="bunny"?47:38)*MS-6;
    if(this.sayUntil>now){this.bub.setAttribute("transform",`translate(${p.x.toFixed(1)},${top.toFixed(1)})`);}
    else if(this.bub.style.display!=="none")this.bub.style.display="none";
    const atHome=!this.path.length&&!this.step&&Math.hypot(this.pos.x-this.d.home.x,this.pos.y-this.d.home.y)<.05;
    const busy=atHome&&this.sayUntil<=now&&view().running().some(a=>a.dept===this.d.id);
    this.typing.style.display=busy?"":"none";if(busy)this.typing.setAttribute("transform",`translate(${p.x.toFixed(1)},${(p.y-32*MS-6).toFixed(1)})`);
  }
}
function wrap(text,n){const words=String(text).split(/\s+/),out=[];let cur="";
  for(const w of words){if((cur+" "+w).trim().length>n&&cur){out.push(cur);cur=w;}else cur=(cur+" "+w).trim();}
  if(cur)out.push(cur);if(out.length>3){out.length=3;out[2]=clip(out[2],n-1)+"…";}return out.map(l=>clip(l,n+4));}
let lastOrder="";
function sortScene(){
  const items=[...DEPTS.map(d=>({el:d.el,z:d.depth,k:"b"+d.id})),...DEPTS.map(d=>({el:d.critter.el,z:d.critter.depth,k:"c"+d.id}))].sort((a,b)=>a.z-b.z);
  const key=items.map(i=>i.k).join();if(key===lastOrder)return;lastOrder=key;items.forEach(i=>L.scene.appendChild(i.el));
}
let lastT=performance.now();
function frame(now){const dt=Math.min(.05,(now-lastT)/1000);lastT=now;DEPTS.forEach(d=>d.critter.update(dt,now));sortScene();requestAnimationFrame(frame);}

/* ================= activity engine ================= */
class Engine{
  constructor(){this.seen=new Set();this.agents=new Map();this.tasks=[];this.feed=[];this.cool={};this.nowFn=()=>Date.now()/1000;}
  ingest(events,animate){let changed=false;
    for(const e of events||[]){const k=`${e.ts}|${e.ev}|${e.id||e.agent||""}|${e.target||e.desc||""}`;if(this.seen.has(k))continue;this.seen.add(k);this.apply(e,animate);changed=true;}
    return changed;}
  log(ts,dept,html){this.feed.push({ts,dept,html});if(this.feed.length>80)this.feed.shift();}
  bind(e){let a=this.agents.get(e.id);
    if(!a){const t=this.tasks.find(t=>t.agent===e.agent&&!t.id);a={id:e.id,agent:e.agent,dept:deptOf(e.agent),desc:t?t.desc:"",start:e.ts,last:e.ts,task:t};
      if(t){t.id=e.id;t.status="run";}else{const nt={n:this.tasks.length+1,agent:e.agent,desc:"",ts:e.ts,status:"run",id:e.id};this.tasks.push(nt);a.task=nt;}
      this.agents.set(e.id,a);}
    return a;}
  running(){const now=this.nowFn();return [...this.agents.values()].filter(a=>!a.stop&&now-a.last<1800);}
  apply(e,animate){
    const ts=e.ts||this.nowFn(),dir=DEPT.lead,ani=animate&&this===view()&&!document.hidden;
    if(e.ev==="assign"){const dept=DEPT[deptOf(e.agent)];
      this.tasks.push({n:this.tasks.length+1,agent:e.agent,desc:e.desc,ts,status:"wait",id:null});
      this.log(ts,"lead",`<b>${esc(dir.leader.name)}</b> giao cho <span class="mono">${esc(e.agent)}</span>: “${esc(e.desc||"việc mới")}”`);
      if(ani&&dept!==dir)dir.critter.visit(dept,`Giao việc: ${e.desc||e.agent}`,"Rõ, sếp!");
      if(ani&&dept===dir)dir.critter.say(`Nhờ ${e.agent}: ${e.desc||""}`);}
    else if(e.ev==="start"){const a=this.bind(e);a.start=ts;a.last=ts;this.log(ts,a.dept,`<span class="mono">${esc(e.agent)}</span> bắt đầu làm việc`);}
    else if(e.ev==="tool"){const a=this.bind(e);a.last=ts;a.tool=e.tool;a.target=e.target;
      const own=["Read","Grep","Glob"].includes(e.tool)?ownerOf(e.target):null,me=DEPT[a.dept];
      if(own&&own!==a.dept&&a.dept!=="lead"){const key=a.dept+">"+own;if(!(this.cool[key]>ts-45)){this.cool[key]=ts;const host=DEPT[own];
        this.log(ts,a.dept,`<b>${esc(me.leader.name)}</b> sang ${esc(host.place)} trao đổi về <span class="mono">${esc(base(e.target))}</span>`);
        if(ani)me.critter.visit(host,`Cho mình xem ${clip(base(e.target),22)} nhé?`,"Đây nè, cứ lấy!");}}
      else if(["Write","Edit","MultiEdit"].includes(e.tool)){const key="w>"+a.id+e.target;if(!(this.cool[key]>ts-120)){this.cool[key]=ts;
        this.log(ts,a.dept,`<span class="mono">${esc(a.agent)}</span> đang viết <span class="mono">${esc(base(e.target))}</span>`);}}}
    else if(e.ev==="stop"){const a=this.bind(e);a.stop=ts;a.last=ts;a.msg=e.msg;if(a.task)a.task.status="done";
      this.log(ts,a.dept,`<span class="mono">${esc(a.agent)}</span> hoàn thành${a.desc?` “${esc(a.desc)}”`:""}`);
      const me=DEPT[a.dept];if(ani&&me!==dir){me.critter.visit(dir,`Báo cáo: xong ${clip(a.desc||a.agent,40)}`,"Tốt lắm!");}}
    else if(e.ev==="pause"){const a=e.id?this.bind(e):null,dept=DEPT[deptOf(e.agent)];if(a)a.paused=true;
      this.log(ts,dept.id,`<span class="mono">${esc(e.agent)}</span> tạm dừng vì usage${e.pct!=null?` ${Math.round(e.pct)}%`:""}, đang viết bàn giao`);
      if(ani)dept.critter.say(dept.id==="lead"?"Cả công ty tạm nghỉ, chờ reset!":"Tạm nghỉ, viết bàn giao đã…",3000);}
    else if(e.ev==="limit"){this.log(ts,"lead",`<b>Chạm giới hạn API</b> (${esc(e.error||"")}): việc dở được ghi vào INTERRUPTED.json`);if(ani)dir.critter.say("Hết usage rồi!",3000);}
    else if(e.ev==="po"){this.log(ts,"lead",`<b>PO</b> vừa gửi tin nhắn cho ${esc(dir.leader.name)}`);if(ani)dir.critter.say("PO vừa nhắn, để tôi xem!",2200);}
    else if(e.ev==="idle"){const lastF=this.feed[this.feed.length-1];if(!lastF||!lastF.idle){this.log(ts,"lead",`${esc(dir.leader.name)} chờ PO phản hồi`);this.feed[this.feed.length-1].idle=true;}
      if(ani&&!this.running().length)dir.critter.say("Chờ PO trả lời…",2600);}
  }
}

    <div class="eyebrow" style="margin-bottom:6px">Đang làm việc${demo?" (mô phỏng)":""}</div>${runList}
    <div class="eyebrow" style="margin-top:14px">Cách đọc bản đồ</div>
    <div class="legend">
      <div class="row"><span class="d" style="background:var(--online)"></span><span>Đèn xanh nhấp nháy, cửa sổ sáng: phòng có sub-agent đang chạy.</span></div>
      <div class="row"><span class="d" style="background:#c9a86a"></span><span>Cửa sổ vàng nhạt: phòng trực ở pha hiện tại.</span></div>
      <div class="row"><span class="d" style="background:var(--accent)"></span><span>Trưởng phòng đi sang tòa khác khi agent của phòng đọc tài liệu của phòng đó, và về Nhà Trắng báo cáo khi xong việc.</span></div>
    </div>
    <p class="foot">${conn==="live"?"Đang đọc trực tiếp <code>state/</code> mỗi 2 giây.":`Bản đồ sống trên máy: <code>python3 scripts/dashboard.py --open</code>`}</p>`;
}
function renderBoards(){
  const eng=view(),tasks=eng.tasks.slice(-8),lbl={done:"Xong",run:"Đang làm",wait:"Chờ"};
  document.getElementById("taskcount").textContent=eng.tasks.length?`${eng.tasks.filter(t=>t.status==="done").length}/${eng.tasks.length} xong`:"";
  document.getElementById("tasks").innerHTML=tasks.length?tasks.map(t=>{const d=DEPT[deptOf(t.agent)];
    return `<li><span class="num ${t.status==="done"?"":t.status}">${t.n}</span><div style="min-width:0"><div class="t">${esc(t.desc||"Việc không tên")}</div>
      <div class="w">${esc(d.leader.name)} · <span class="mono">${esc(t.agent)}</span></div></div><span class="st ${t.status}">${lbl[t.status]}</span></li>`;}).join("")
    :`<li style="display:block" class="empty">Chưa có việc nào được giao. Mỗi lần giám đốc gọi một sub-agent, việc đó hiện ở đây kèm trạng thái.</li>`;
  const feed=eng.feed.slice(-14).reverse();
  document.getElementById("feed").innerHTML=feed.length?feed.map(f=>`<li><time>${hhmm(f.ts)}</time><span class="d" style="background:${DEPT[f.dept]?DEPT[f.dept].color:"#888"}"></span><span>${f.html}</span></li>`).join("")
    :`<li style="display:block" class="empty">Nhật ký trống. Hook <code>activity_log.py</code> ghi lại mỗi lần agent bắt đầu, đọc tài liệu, viết file và hoàn thành.</li>`;
}

async function poll(){
  try{const r=await fetch("/api/state",{cache:"no-store"});if(!r.ok)throw 0;const s=await r.json();SNAP=s;
    if(conn!=="live"){conn="live";}const changed=real.ingest(s.events,true);renderHud();renderPipe();
    if(changed||!demo){renderLabels();applyBuildingState();renderPanel();renderBoards();}}
  catch(_){if(conn!=="off"){conn="off";renderHud();}}
}

function startPlayback(kind){
  if(demo)return;DEPTS.forEach(d=>d.critter.reset());
  let script;
  if(kind==="demo")script=DEMO;
  else{const ev=(SNAP.events||[]).slice(-60);script=ev.map((e,i)=>[i?Math.min(3,Math.max(.6,e.ts-ev[i-1].ts)):0,e]);}
  const eng=new Engine();demo={kind,engine:eng,timers:[]};selected=null;renderAll();
  let t=600;
  script.forEach(([gap,e])=>{t+=gap*1000;demo.timers.push(setTimeout(()=>{eng.ingest([{...e,ts:Date.now()/1000+Math.random()/1e3}],true);
    renderHud();renderLabels();applyBuildingState();renderPanel();renderBoards();},t));});
  demo.timers.push(setTimeout(stopPlayback,t+9000));
}
function stopPlayback(){if(!demo)return;demo.timers.forEach(clearTimeout);demo=null;DEPTS.forEach(d=>d.critter.reset());renderAll();}
document.getElementById("btn-demo").onclick=()=>startPlayback("demo");
document.getElementById("btn-replay").onclick=()=>startPlayback("replay");

/* ================= starfield ================= */
function stars(){const c=document.getElementById("stars"),x=c.getContext("2d");
  function draw(){const w=c.width=innerWidth,h=c.height=innerHeight;x.clearRect(0,0,w,h);
    for(let i=0;i<150;i++){x.globalAlpha=Math.random()*.6+.2;x.fillStyle=Math.random()>.85?"#ffd9a0":"#dfe6ff";x.beginPath();x.arc(Math.random()*w,Math.random()*h,Math.random()*1.3+.2,0,7);x.fill();}x.globalAlpha=1;}
  draw();addEventListener("resize",draw);}

/* ================= zoom, pan, full window ================= */
const VB0={x:-(GS*HW+20),y:-130,w:2*(GS*HW+20),h:GS*2*HH+210},ZMAX=4;   // matches the <svg> viewBox
let vb={...VB0},drag=null,swallowClick=false,maxed=false;
function setView(){
  vb.w=Math.min(VB0.w,Math.max(VB0.w/ZMAX,vb.w));vb.h=vb.w*VB0.h/VB0.w;
  vb.x=Math.min(VB0.x+VB0.w-vb.w,Math.max(VB0.x,vb.x));vb.y=Math.min(VB0.y+VB0.h-vb.h,Math.max(VB0.y,vb.y));
  map.setAttribute("viewBox",[vb.x,vb.y,vb.w,vb.h].map(v=>v.toFixed(1)).join(" "));
  const z=VB0.w/vb.w;map.classList.toggle("zoomed",z>1.01);map.classList.toggle("close",z>=1.6);
  document.getElementById("z-lvl").textContent=Math.round(z*100)+"%";
  document.getElementById("z-out").disabled=z<=1.01;document.getElementById("z-in").disabled=z>=ZMAX-.01;
}
const svgPoint=(cx,cy)=>new DOMPoint(cx,cy).matrixTransform(map.getScreenCTM().inverse());
const viewCenter=()=>({x:vb.x+vb.w/2,y:vb.y+vb.h/2});
function zoomAt(f,pt=viewCenter()){const nw=Math.min(VB0.w,Math.max(VB0.w/ZMAX,vb.w/f)),k=nw/vb.w;
  vb.x=pt.x-(pt.x-vb.x)*k;vb.y=pt.y-(pt.y-vb.y)*k;vb.w=nw;setView();}
function setMax(on){maxed=on;document.querySelector(".main").classList.toggle("max",on);document.body.classList.toggle("maxmap",on);
  const b=document.getElementById("btn-max");b.setAttribute("aria-pressed",on);b.querySelector("span").textContent=on?"Thu nhỏ khung":"Toàn màn hình";
  if(on&&document.fullscreenEnabled&&!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});
  if(!on&&document.fullscreenElement)document.exitFullscreen().catch(()=>{});}
document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement&&maxed)setMax(false);});
document.getElementById("z-in").onclick=()=>zoomAt(1.4);
document.getElementById("z-out").onclick=()=>zoomAt(1/1.4);
document.getElementById("btn-fit").onclick=()=>{vb={...VB0};setView();};
document.getElementById("btn-max").onclick=()=>setMax(!maxed);
/* wheel zooms only with Ctrl/⌘ (or trackpad pinch) so normal scrolling still moves the page; in full window it always zooms */
document.getElementById("mapscroll").addEventListener("wheel",e=>{if(!(e.ctrlKey||e.metaKey||maxed))return;e.preventDefault();
  zoomAt(Math.exp(-e.deltaY*(e.deltaMode?.05:.0018)),svgPoint(e.clientX,e.clientY));},{passive:false});
/* drag to pan once zoomed; a drag never counts as a click on a building */
map.addEventListener("pointerdown",e=>{if(e.button!==0||VB0.w/vb.w<=1.01)return;
  drag={id:e.pointerId,x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y,s:map.getScreenCTM().a,moved:false};});
map.addEventListener("pointermove",e=>{if(!drag||e.pointerId!==drag.id)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.moved){if(Math.hypot(dx,dy)<5)return;drag.moved=true;map.setPointerCapture(e.pointerId);map.classList.add("panning");}
  vb.x=drag.vx-dx/drag.s;vb.y=drag.vy-dy/drag.s;setView();});
const endDrag=e=>{if(!drag||e.pointerId!==drag.id)return;if(drag.moved){swallowClick=true;setTimeout(()=>swallowClick=false,0);}map.classList.remove("panning");drag=null;};
map.addEventListener("pointerup",endDrag);map.addEventListener("pointercancel",endDrag);
map.addEventListener("click",e=>{if(swallowClick){e.stopPropagation();swallowClick=false;}},true);
addEventListener("keydown",e=>{if(e.ctrlKey||e.metaKey||e.altKey||/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
  if(e.key==="Escape"&&maxed)setMax(false);else if(e.key==="+"||e.key==="=")zoomAt(1.4);else if(e.key==="-")zoomAt(1/1.4);
  else if(e.key==="0"){vb={...VB0};setView();}else if(e.key==="f"||e.key==="F")setMax(!maxed);});

buildGrid();buildScene();real.ingest(SNAP.events,false);renderAll();stars();setView();requestAnimationFrame(frame);
const sc=document.getElementById("mapscroll");sc.scrollLeft=(sc.scrollWidth-sc.clientWidth)/2;
